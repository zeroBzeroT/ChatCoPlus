# Configuration file for ChatCoPlus ${project.version} (https://github.com/zeroBzeroT/ChatCoPlus)
ChatCo:
  created: ${project.version}
  chatDisabled: false
  bStats: true
  chatToConsole: true
  toggleChatEnabled: true
  ignoresEnabled: true
  ignoreMessageEnabled: true
  chatDisabledMessageEnabled: true
  spoilersEnabled: false
  whisperChangesEnabled: true
  whisperOnClick: true
  newCommands: true
  replyCommands: true
  lastCommand: true
  whisperLog: false
  whisperMonitoring: false
  # Ghost blocking of file sharing links: the sender still sees his own message,
  # but it never reaches the other players, the console or any other plugin.
  # The blocked domains are listed in blockedDomains.txt, subdomains are covered as well.
  # Players with the permission ChatCo.linkBlock.bypass are not affected.
  linkBlock:
    enabled: true
    blockWhispers: true
    logToConsole: false
  whisperFormat:
    receive: "%SENDER% whispers: "
    send: "To %RECEIVER%: "
    color: light_purple
  chatPrefixes:
    aqua: null
    black: null
    blue: null
    bold: null
    dark_aqua: null
    dark_blue: null
    dark_gray: null
    dark_green: null
    dark_purple: null
    dark_red: null
    gold: null
    gray: null
    green: ">"
    italic: null
    light_purple: null
    magic: null
    red: null
    strikethrough: null
    underline: null
    white: null
    yellow: null
  chatColors:
    aqua: null
    black: null
    blue: "`"
    bold: null
    dark_aqua: null
    dark_blue: null
    dark_gray: null
    dark_green: null
    dark_purple: null
    dark_red: null
    gold: null
    gray: null
    green: null
    italic: null
    light_purple: null
    magic: null
    red: null
    strikethrough: null
    underline: null
    white: null
    yellow: null

  redis:
    host: 127.0.0.1
    port: 6379

  playtimeGate:
    thresholdHours: 10

    wordFilter:
      enabled: true
      # set to "" to delete the matched word entirely
      replacement: "*"
      fuzzy: false

    rulesNotice:
      enabled: true
      message: |-
        &6Please follow the community standards:
        &9https://www.minecraft.net/en-us/community-standards

    linkBlock:
      enabled: true
      # set to "" to delete the URL entirely
      replacement: "[link removed]"